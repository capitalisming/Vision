<?xml version="1.0" encoding="UTF-8"?>
<!-- AI-assisted (Claude Code), reviewed by a team member. HC-SR04 to Raspberry Pi 4 wiring, as built. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="system-ui, sans-serif" font-size="14">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="600" fill="#1f2328">HC-SR04 → Raspberry Pi 4 (Pi powered off while wiring)</text>

  <!-- HC-SR04 -->
  <rect x="30" y="70" width="170" height="250" rx="8" fill="#e8f1fb" stroke="#0969da" stroke-width="2"/>
  <text x="115" y="96" text-anchor="middle" font-weight="600">HC-SR04</text>
  <circle cx="80" cy="135" r="26" fill="#fff" stroke="#57606a"/><circle cx="150" cy="135" r="26" fill="#fff" stroke="#57606a"/>
  <g font-size="13"><text x="185" y="194" text-anchor="end">VCC</text><text x="185" y="234" text-anchor="end">Trig</text>
  <text x="185" y="274" text-anchor="end">Echo</text><text x="185" y="314" text-anchor="end">GND</text></g>
  <g fill="#1f2328"><circle cx="200" cy="190" r="4"/><circle cx="200" cy="230" r="4"/><circle cx="200" cy="270" r="4"/><circle cx="200" cy="310" r="4"/></g>

  <!-- Raspberry Pi header -->
  <rect x="640" y="70" width="190" height="300" rx="8" fill="#fbeaea" stroke="#cf222e" stroke-width="2"/>
  <text x="735" y="96" text-anchor="middle" font-weight="600">Raspberry Pi 4 header</text>
  <g font-size="13">
    <circle cx="640" cy="190" r="4"/><text x="652" y="194">pin 2 · 5V</text>
    <circle cx="640" cy="230" r="4"/><text x="652" y="234">pin 16 · GPIO23 (Trig)</text>
    <circle cx="640" cy="270" r="4"/><text x="652" y="274">pin 18 · GPIO24 (Echo in)</text>
    <circle cx="640" cy="350" r="4"/><text x="652" y="354">pin 14 · GND</text>
  </g>
  <text x="735" y="395" text-anchor="middle" font-size="12" fill="#57606a">pins 4 and 6: case fan</text>

  <!-- wires -->
  <path d="M200 190 H640" stroke="#cf222e" stroke-width="3" fill="none"/>
  <text x="420" y="183" text-anchor="middle" font-size="12" fill="#57606a">VCC: red → "+" rail → white</text>
  <path d="M200 230 H640" stroke="#1a7f37" stroke-width="3" fill="none"/>
  <text x="420" y="223" text-anchor="middle" font-size="12" fill="#57606a">Trig: green</text>

  <!-- Echo through R1 to point X -->
  <path d="M200 270 H280" stroke="#1f2328" stroke-width="2" fill="none"/>
  <rect x="280" y="260" width="70" height="20" fill="#f5e6c8" stroke="#1f2328"/>
  <text x="315" y="252" text-anchor="middle" font-size="12">R1 = 1 kΩ (beige)</text>
  <path d="M350 270 H430" stroke="#1f2328" stroke-width="2" fill="none"/>
  <circle cx="430" cy="270" r="6" fill="#8250df"/>
  <text x="440" y="258" font-weight="600" fill="#8250df">X</text>
  <path d="M430 270 H640" stroke="#8250df" stroke-width="3" fill="none"/>
  <text x="540" y="263" text-anchor="middle" font-size="12" fill="#57606a">purple</text>

  <!-- R2 from X to GND -->
  <path d="M430 276 V300" stroke="#1f2328" stroke-width="2" fill="none"/>
  <rect x="420" y="300" width="20" height="40" fill="#cde4f7" stroke="#1f2328"/>
  <text x="450" y="325" font-size="12">R2 = 2 kΩ (blue)</text>
  <path d="M430 340 V350" stroke="#1f2328" stroke-width="2" fill="none"/>

  <!-- GND rail -->
  <path d="M200 310 H250 V350 H640" stroke="#0550ae" stroke-width="3" fill="none"/>
  <circle cx="430" cy="350" r="4" fill="#0550ae"/>
  <text x="540" y="343" text-anchor="middle" font-size="12" fill="#57606a">GND: blue → "−" rail → black</text>

  <!-- notes -->
  <g font-size="13" fill="#1f2328">
    <text x="30" y="420">Divider: 5 V × R2 / (R1 + R2) = 5 × 2 / 3 ≈ 3.3 V at GPIO24. Echo is never wired straight to the Pi.</text>
    <text x="30" y="442">Code uses BCM numbers: trigger = 23, echo = 24 (gpiozero), not header pins 16 and 18.</text>
  </g>
</svg>
